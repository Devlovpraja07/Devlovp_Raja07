<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GitHub Auth</title>
</head>
<body>
  <p>Connecting...</p>

  <script type="module">
    // Import Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3_hr1PPPiprghSQy8KkPndK8FV6g_yyY",
      authDomain: "rn-gfx.firebaseapp.com",
      databaseURL: "https://rn-gfx-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "rn-gfx",
      storageBucket: "rn-gfx.firebasestorage.app",
      messagingSenderId: "426859283244",
      appId: "1:426859283244:web:authhtml"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CLIENT_ID = "Ov23lisRwic3z0VX2i71";
    const CLIENT_SECRET = "cf47ca1bcb383b81ddefc16996f0f0626e8fa5c9";
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    async function exchangeCodeForToken(code) {
      const res = await fetch("https://github.com/login/oauth/access_token", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          client_id: CLIENT_ID,
          client_secret: CLIENT_SECRET,
          code
        })
      });
      return res.json();
    }

    async function getUserData(token) {
      const res = await fetch("https://api.github.com/user", {
        headers: { Authorization: `token ${token}` }
      });
      return res.json();
    }

    async function main() {
      if (!code) {
        document.body.innerHTML = "<p>No code found.</p>";
        return;
      }

      try {
        const tokenData = await exchangeCodeForToken(code);
        const token = tokenData.access_token;
        const user = await getUserData(token);

        // ✅ Save to Firebase
        await set(ref(db, "github_users/" + user.id), {
          id: user.id,
          name: user.name || user.login,
          username: user.login,
          avatar: user.avatar_url,
          profile_url: user.html_url,
          email: user.email || "hidden",
          time: new Date().toISOString()
        });

        // ✅ Redirect to your Android app
        window.location.href = `yourapp://callback?user=${encodeURIComponent(JSON.stringify(user))}`;
      } catch (e) {
        document.body.innerHTML = "<p>Error connecting to GitHub.</p>";
        console.error(e);
      }
    }

    main();
  </script>
</body>
</html>
