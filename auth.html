<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub OAuth Redirect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    h2 { color: #58a6ff; }
    .loading { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <h2>Authenticating with GitHub...</h2>
  <p class="loading">Please wait ⏳</p>

  <script>
    const client_id = "Ov23lisRwic3z0VX2i71";  // 🔹 Replace with your GitHub Client ID
    const client_secret = "f3c5bded916ae2c297256324a40da73a902a0937";  // 🔹 Replace with your Client Secret

    async function handleAuth() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      if (!code) {
        document.body.innerHTML = "<h2 style='color:red'>Error: No code parameter found.</h2>";
        return;
      }

      try {
        const response = await fetch("https://github.com/login/oauth/access_token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            client_id: client_id,
            client_secret: client_secret,
            code: code
          })
        });

        const data = await response.json();

        if (data.access_token) {
          // ✅ Send access token back to Android App
          window.location.href = "yourapp://callback?code=" + code + "&token=" + data.access_token;
        } else {
          document.body.innerHTML = "<h2 style='color:red'>Error: Access token not received.</h2><p>" + JSON.stringify(data) + "</p>";
        }
      } catch (err) {
        document.body.innerHTML = "<h2 style='color:red'>Something went wrong during authentication.</h2><p>" + err.message + "</p>";
      }
    }

    handleAuth();
  </script>
</body>
</html>
