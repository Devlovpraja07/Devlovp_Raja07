<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Auth</title>
  <style>body{font-family:system-ui;background:#0d1117;color:#c9d1d9;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center}</style>
</head>
<body>
  <h2>Signing in with GitHub…</h2>
  <p id="msg">Please wait…</p>

  <script>
    async function run() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (!code) {
        document.getElementById('msg').textContent = 'No code found in URL.';
        return;
      }

      try {
        // Send code to serverless api to exchange for token
        const resp = await fetch('/api/exchange', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ code })
        });
        const data = await resp.json();

        if (!resp.ok) {
          document.getElementById('msg').textContent = 'Server error: ' + (data.error || resp.status);
          console.error(data);
          return;
        }

        if (!data.access_token) {
          document.getElementById('msg').textContent = 'No access token returned.';
          console.error(data);
          return;
        }

        // Option A: fetch user on web
        const userRes = await fetch('https://api.github.com/user', {
          headers: { Authorization: 'Bearer ' + data.access_token }
        });
        const user = await userRes.json();

        // Example: redirect to Android app deep link with token (if you want)
        // window.location.href = `yourapp://callback?token=${data.access_token}&login=${encodeURIComponent(user.login)}`;

        // Or show simple success on web:
        document.body.innerHTML = `<h2>Welcome, ${user.login} ✅</h2><img src="${user.avatar_url}" width="96" style="border-radius:50%"><p><a href="${user.html_url}" target="_blank">View on GitHub</a></p>`;
      } catch (err) {
        console.error(err);
        document.getElementById('msg').textContent = 'Something went wrong during authentication.';
      }
    }
    run();
  </script>
</body>
</html>
